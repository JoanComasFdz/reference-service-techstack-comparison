services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: performancetest-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - performancetest_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - performance-infra

  postgres:
    image: postgres:15
    container_name: performancetest-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: performancetest_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - performancetest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d performancetest_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - performance-infra

volumes:
  performancetest_postgres_data:
  performancetest_rabbitmq_data:

networks:
  performance-infra:
    name: performance-infra
