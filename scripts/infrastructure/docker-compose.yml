services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: performancetest-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    container_name: performancetest-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: performancetest_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d performancetest_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
