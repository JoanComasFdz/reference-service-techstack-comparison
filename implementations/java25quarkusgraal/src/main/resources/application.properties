# Application
quarkus.application.name=java25QuarkusGraalReferenceService
quarkus.package.jar.type=uber-jar

# HTTP Server Configuration
quarkus.http.port=8103

# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:admin}
quarkus.datasource.password=${POSTGRES_PASSWORD:admin}
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:java25quarkus_db}

# Hibernate ORM Configuration
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# RabbitMQ Global Connection Configuration
mp.messaging.connector.smallrye-rabbitmq.host=${RABBITMQ_HOST:localhost}
mp.messaging.connector.smallrye-rabbitmq.port=${RABBITMQ_PORT:5672}
mp.messaging.connector.smallrye-rabbitmq.username=${RABBITMQ_USER:admin}
mp.messaging.connector.smallrye-rabbitmq.password=${RABBITMQ_PASSWORD:admin}

# RabbitMQ Incoming Channel (status-changed)
mp.messaging.incoming.status-changed.connector=smallrye-rabbitmq
mp.messaging.incoming.status-changed.queue.name=javaQuarkusGraal25
mp.messaging.incoming.status-changed.queue.durable=true
mp.messaging.incoming.status-changed.exchange.name=referenceservice.comparison
mp.messaging.incoming.status-changed.exchange.type=topic
mp.messaging.incoming.status-changed.exchange.durable=true
mp.messaging.incoming.status-changed.routing-keys=instrument.status.changed
mp.messaging.incoming.status-changed.auto-bind-queue=true
mp.messaging.incoming.status-changed.qos.prefetch-count=50
mp.messaging.incoming.status-changed.auto-acknowledgement=false

# RabbitMQ Outgoing Channel (kpi-updated)
mp.messaging.outgoing.kpi-updated.connector=smallrye-rabbitmq
mp.messaging.outgoing.kpi-updated.exchange.name=referenceservice.comparison
mp.messaging.outgoing.kpi-updated.exchange.type=topic
mp.messaging.outgoing.kpi-updated.exchange.durable=true
mp.messaging.outgoing.kpi-updated.routing-key=instrumentstatus.kpi.updated
mp.messaging.outgoing.kpi-updated.default-routing-key=instrumentstatus.kpi.updated

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."com.joancomasfdz.performancetest".level=DEBUG
quarkus.log.category."io.smallrye.reactive.messaging".level=DEBUG
# Suppress harmless shutdown race condition errors
quarkus.log.category."io.vertx.rabbitmq.impl.RabbitMQClientImpl".level=WARN

# Native Image Configuration
quarkus.native.resources.includes=application.properties
