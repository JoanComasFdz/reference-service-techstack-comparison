server:
  port: 8097

spring:
  application:
    name: java21SpringBootReferenceService

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
    listener:
      simple:
        prefetch: 10

  datasource:
    url: jdbc:postgresql://localhost:5432/java21springboot_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.joancomasfdz.performancetest: DEBUG
    org.springframework.amqp: DEBUG
